[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyextrusion"
version = "0.17.0.dev0"
description = "Engineering calculation toolkit for aluminium extrusion"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Enrique Calvo Ordonez"}]
maintainers = [{name = "Enrique Calvo Ordonez"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["aluminium", "aluminum", "extrusion", "engineering", "manufacturing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://pyextrusion.com"
Documentation = "https://pyextrusion.com"
Repository = "https://github.com/enrique-co/pyextrusion"
Issues = "https://github.com/enrique-co/pyextrusion/issues"
Changelog = "https://github.com/enrique-co/pyextrusion/blob/main/CHANGELOG.md"

[project.scripts]
pyextrusion = "pyextrusion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
pyextrusion = ["py.typed"]
